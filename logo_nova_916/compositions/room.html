  <script>
    (function () {

      const tc = root.querySelector("#rm-tc");
      const DUR = 18.7667;
      const pad = (n) => String(n).padStart(2, "0");
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      // Đồng hồ timeline chạy khớp thời gian video, như trong reel gốc
      tl.to(
        clock,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: () => {
            const f = Math.floor(clock.t * 30 + 1e-6);
            tc.textContent = `0:00:${pad(Math.floor(f / 30))}:${pad(f % 30)}`;
          },
        },
        0,
      );
      tl.fromTo("#rm-playhead", { x: 0 }, { x: 980, duration: DUR, ease: "none" }, 0);
      window.__timelines["room"] = tl;
    })();
