<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18.7667"
      data-width="1080"
      data-height="1920"
    >
      <div id="room" data-composition-id="room" data-composition-src="compositions/room.html" data-start="0" data-duration="18.7667" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- Cảnh trong màn, cắt trên lưới phách 115 BPM (1 phách = 0,5217 s) -->
      <div id="build" data-composition-id="build" data-composition-src="compositions/build.html" data-start="0" data-duration="4.1667" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="wordmark" data-composition-id="wordmark" data-composition-src="compositions/wordmark.html" data-start="4.1667" data-duration="6.2666" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="variants" data-composition-id="variants" data-composition-src="compositions/variants.html" data-start="12.5333" data-duration="6.2334" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="glass" data-composition-id="glass" data-composition-src="compositions/glass.html" data-start="0" data-duration="18.7667" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <!-- Lồi khỏi màn: nằm trên lớp kính -->
      <div id="popout" data-composition-id="popout" data-composition-src="compositions/popout.html" data-start="10.4333" data-duration="2.1" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.6" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- Nhạc: "Summer Fun" (Mixkit), 115 BPM, beat đầu ở 0,4876 s của file → trùng t = 0 -->
      <audio id="music" class="clip" src="assets/music/summer-fun.mp3" data-start="0" data-duration="18.7667" data-media-start="0.4876" data-track-index="10" data-volume="0.8" data-fade-out="0.25"></audio>
      <!-- SFX (Pixabay, assets/sfx/CREDITS.md) -->
      <audio id="sfx-cut" class="clip" src="assets/sfx/click.mp3" data-start="1.30" data-duration="0.37" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-ring" class="clip" src="assets/sfx/pop.mp3" data-start="2.30" data-duration="0.72" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-pop-word" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.33" data-duration="0.57" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-pop-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="10.43" data-duration="1.2" data-track-index="13" data-volume="0.35"></audio>
      <audio id="sfx-phone" class="clip" src="assets/sfx/whoosh-b.mp3" data-start="11.40" data-duration="0.5" data-track-index="12" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
