<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- Cảnh 1: đèn tự lắp, bật sáng, quét 4 trạm chữ + logo -->
      <div
        id="spotlight"
        data-composition-id="spotlight"
        data-composition-src="compositions/spotlight.html"
        data-start="0"
        data-duration="9.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <!-- Cảnh 2: tấm trắng đẩy lên, handle -->
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="8.8"
        data-duration="2.7"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <!-- SFX (Pixabay, xem assets/sfx/CREDITS.md). data-start = khung chạm − thời điểm đỉnh của file -->
      <audio id="sfx-lens-pop" class="clip" src="assets/sfx/pop.mp3" data-start="0.48" data-duration="0.72" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-switch" class="clip" src="assets/sfx/click.mp3" data-start="0.96" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="1.02" data-duration="1.8" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-swing1" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.31" data-duration="0.57" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-swing2" class="clip" src="assets/sfx/whoosh-b.mp3" data-start="3.83" data-duration="0.5" data-track-index="14" data-volume="0.7"></audio>
      <audio id="sfx-swing3" class="clip" src="assets/sfx/whoosh-c.mp3" data-start="5.29" data-duration="0.65" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-swing-logo" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="4.65" data-duration="5.5" data-track-index="15" data-volume="0.55"></audio>
      <audio id="sfx-logo-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="7.13" data-duration="2.1" data-track-index="16" data-volume="0.35"></audio>
      <audio id="sfx-beam-off" class="clip" src="assets/sfx/click.mp3" data-start="8.38" data-duration="0.37" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-panel" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.77" data-duration="0.57" data-track-index="14" data-volume="0.7"></audio>
      <audio id="sfx-tick1" class="clip" src="assets/sfx/key-press.mp3" data-start="10.82" data-duration="0.4" data-track-index="17" data-volume="2"></audio>
      <audio id="sfx-tick2" class="clip" src="assets/sfx/key-press.mp3" data-start="10.94" data-duration="0.4" data-track-index="18" data-volume="2"></audio>
      <audio id="sfx-tick3" class="clip" src="assets/sfx/key-press.mp3" data-start="11.06" data-duration="0.4" data-track-index="19" data-volume="2"></audio>
      <audio id="sfx-tick4" class="clip" src="assets/sfx/key-press.mp3" data-start="11.18" data-duration="0.32" data-track-index="20" data-volume="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
